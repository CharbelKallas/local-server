name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and script unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install htpasswd
        run: sudo apt-get update -q && sudo apt-get install -y -q apache2-utils
      - name: make test
        run: make test

  e2e:
    name: End-to-end (kind)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: test
    env:
      KIND_VERSION: v0.33.0
      # sha256 of kind-linux-amd64 for KIND_VERSION, from the release's
      # .sha256sum file. Pinned here so a tampered download fails the job.
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install htpasswd and kind
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q apache2-utils
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind && rm kind
          kind version; kubectl version --client; helm version
      - name: make test-e2e
        run: make test-e2e

# MongoDB Service — ClusterIP only (in-cluster access).
# Address inside the cluster: mongodb.databases.svc.cluster.local:27017
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: databases
  labels:
    app: mongodb
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017

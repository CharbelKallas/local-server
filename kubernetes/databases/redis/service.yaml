# Redis Service — ClusterIP only (in-cluster access).
# Address inside the cluster: redis.databases.svc.cluster.local:6379
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: databases
  labels:
    app: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

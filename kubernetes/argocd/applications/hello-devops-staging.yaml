# Argo CD Application for the EXTERNAL application repository
# "hello-devops" — environment: staging.
#
# Sibling of hello-devops-dev.yaml: same repository, different path
# ("staging" instead of "dev") and different target namespace. Kargo
# commits the promoted image digest to <repo>:staging/ when Freight is
# promoted into the staging Stage; Argo CD's automated sync applies it.
#
# RESOLVED — no placeholders remain in this file:
#   repoURL         https://github.com/CharbelKallas/hello-devops.git
#   targetRevision  master (the branch holding the dev/ and staging/ paths)
# The remaining infrastructure placeholder <LOCAL_REGISTRY_URL> lives in
# kubernetes/kargo/ and in the application's base/deployment.yaml.
#
# Status: configuration only — not applied to the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-devops-staging
  namespace: argocd   # Argo CD only discovers Applications in its own namespace
spec:
  # Built-in "default" AppProject (unrestricted in this lab).
  project: default
  source:
    repoURL: https://github.com/CharbelKallas/hello-devops.git
    targetRevision: master
    path: staging
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-devops-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
